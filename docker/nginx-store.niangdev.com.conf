# Nginx de l'hôte (VPS) : /etc/nginx/sites-available/store.niangdev.com
# Certificat : sudo certbot --nginx -d store.niangdev.com
server {
    listen 80;
    server_name store.niangdev.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name store.niangdev.com;

    # Lignes gérées par certbot
    ssl_certificate     /etc/letsencrypt/live/store.niangdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.niangdev.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # La compression est déjà faite par le serveur Node
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
